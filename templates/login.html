{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="col-md-5">
        <div class="card auth-card border-0 p-4 shadow-lg">
            <div class="text-center mb-4">
                <div class="d-inline-flex justify-content-center align-items-center bg-primary-subtle text-primary rounded-circle p-3 mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-shield-halved text-accent-light fa-2x"></i>
                </div>
                <h3 class="fw-bold mb-1">Espace Sécurisé</h3>
                <p class="text-muted small">Connectez-vous pour gérer votre portefeuille COFINANCE CI</p>
            </div>
            
            <form method="POST" action="{% url 'login_web' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Identifiant unique (username)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control border-start-0 bg-white" name="username" placeholder="Ex: mory_diop" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control border-start-0 bg-white" name="password" placeholder="Saisissez votre mot de passe" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-2.5">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Se connecter
                </button>
            </form>
            
            <div class="text-center mt-4 border-top pt-3">
                <p class="mb-0 text-muted small">Nouveau sur COFINANCE CI ? <a href="{% url 'register_web' %}" class="text-accent-light fw-bold text-decoration-none">Créer un compte client</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
