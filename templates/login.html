{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card auth-card border-0 p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock text-accent fa-3x mb-3"></i>
                <h3 class="fw-bold">Connexion</h3>
                <p class="text-muted">Accédez à votre espace sécurisé COFINANCE CI</p>
            </div>
            
            <form method="POST" action="{% url 'login_web' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Identifiant unique (username)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 bg-light" name="username" placeholder="Ex: mory_diop" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 bg-light" name="password" placeholder="Votre mot de passe" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-2.5">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Se connecter
                </button>
            </form>
            
            <div class="text-center mt-4 border-top pt-3">
                <p class="mb-0 text-muted">Nouveau sur COFINANCE CI ? <a href="{% url 'register_web' %}" class="text-accent fw-semibold">Créer un compte</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
